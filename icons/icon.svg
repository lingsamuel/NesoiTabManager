<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Nesoi 标签管理器">
  <!--
    扩展图标源文件（矢量）。
    视觉语义：暖白「标签卡片」叠放在青绿底板上，对应「把海量标签页收进列表」。
    配色取自 popup.css / 管理页的主题变量：
      accent #0f766e / accent-dark #0b5b55 / panel #fffdf7。
    为了让 16px 下仍能看清，前景卡片刻意放大、只保留两条粗线，
    叠层只用一层半透明卡片示意「有更多列表」。
    改动本文件后，用仓库根目录的 `npm run icons` 重新导出各尺寸 PNG。
  -->
  <defs>
    <linearGradient id="nesoi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12968b" />
      <stop offset="1" stop-color="#0b5b55" />
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块，保证在浅色/深色工具栏上都成型 -->
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#nesoi-bg)" />

  <!-- 后层卡片：只从右上角露出一角，表达「还有其它列表」 -->
  <rect x="42" y="20" width="64" height="64" rx="15" fill="#fffdf7" opacity="0.38" />

  <!-- 前层卡片：主体的「列表」，用大圆角与底板留出统一留白 -->
  <rect x="24" y="32" width="80" height="80" rx="16" fill="#fffdf7" />

  <!-- 列表条目：两条粗线，16px 下分别落到 5px / 4px，仍可区分 -->
  <rect x="38" y="52" width="46" height="11" rx="5.5" fill="#0f766e" />
  <rect x="38" y="72" width="30" height="11" rx="5.5" fill="#0f766e" opacity="0.5" />
</svg>
